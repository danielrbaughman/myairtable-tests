[project]
name = "myairtable-tests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["dateparser>=1.3.0", "pyairtable>=3.3.0", "pytest>=9.0.2", "ruff>=0.15.1", "ty>=0.0.17"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 150
extend-exclude = ["python/output"]

[tool.ruff.lint]
extend-select = ["I", "N"]
ignore = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["output"]

[tool.ruff.format]
skip-magic-trailing-comma = false
