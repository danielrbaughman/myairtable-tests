[package]
name = "myairtable-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "rust/output/dynamic/lib.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "test_serializing"
path = "rust/tests/test_serializing.rs"

[[test]]
name = "test_crud"
path = "rust/tests/test_crud.rs"

[[bin]]
name = "playground"
path = "playground.rs"

[dev-dependencies]
dotenvy = "0.15"
