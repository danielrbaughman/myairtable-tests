[package]
name = "myairtable-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "rust/output/dynamic/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dotenvy = "0.15"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "test_serializing"
path = "rust/tests/test_serializing.rs"

[[test]]
name = "test_struct_crud_via_table"
path = "rust/tests/test_struct_crud_via_table.rs"

[[test]]
name = "test_filter_by_formula"
path = "rust/tests/test_filter_by_formula.rs"

[[test]]
name = "test_orm_crud_via_table"
path = "rust/tests/test_orm_crud_via_table.rs"

[[test]]
name = "test_orm_crud_via_model"
path = "rust/tests/test_orm_crud_via_model.rs"

[[test]]
name = "test_caching"
path = "rust/tests/test_caching.rs"

[[test]]
name = "test_runtime_formulas"
path = "rust/tests/test_runtime_formulas.rs"

[[test]]
name = "test_primary_formula_runtime"
path = "rust/tests/test_primary_formula_runtime.rs"

[[test]]
name = "test_runtime_formula_variety"
path = "rust/tests/test_runtime_formula_variety.rs"

[[test]]
name = "test_special_error_deser"
path = "rust/tests/test_special_error_deser.rs"

[[test]]
name = "test_pagination"
path = "rust/tests/test_pagination.rs"

[[test]]
name = "test_formula_escaping"
path = "rust/tests/test_formula_escaping.rs"

[[test]]
name = "test_error_paths"
path = "rust/tests/test_error_paths.rs"

[[test]]
name = "test_field_round_trip"
path = "rust/tests/test_field_round_trip.rs"

[[test]]
name = "test_multi_field_sort"
path = "rust/tests/test_multi_field_sort.rs"

[[bin]]
name = "playground"
path = "playground.rs"
