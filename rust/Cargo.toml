[package]
name = "myairtable-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "output/static/lib.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
dotenvy = "0.15"
